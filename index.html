<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SciTI</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{--primary:#1a5f7a;--accent:#57c5b6;--bg:#f4f9f9;--card:#fff;--text:#2c3e50;--muted:#7f8c8d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:24px 16px}
.hidden{display:none!important}
.hero{text-align:center;padding:48px 0 32px}
.hero h1{font-size:2.2rem;color:var(--primary);margin-bottom:8px}
.hero .subtitle{color:var(--muted);font-size:1rem;margin-bottom:32px}
.btn{display:inline-block;padding:14px 36px;border-radius:28px;border:none;font-size:1.05rem;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:center}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;box-shadow:0 4px 14px rgba(26,95,122,.35)}
.btn:hover{transform:translateY(-2px)}
.btn-secondary{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.disclaimer{background:#fff3cd;border-left:4px solid #f0ad4e;padding:16px;border-radius:8px;margin:24px 0;font-size:.9rem;color:#856404}
.progress-wrap{margin-bottom:20px}
.progress-bar{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));width:0%;transition:width .3s ease}
.progress-text{text-align:right;font-size:.8rem;color:var(--muted);margin-top:4px}
.question-card{background:var(--card);border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:16px}
.question-number{font-size:.85rem;color:var(--accent);font-weight:600;margin-bottom:8px}
.question-text{font-size:1.15rem;font-weight:500;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:10px}
.option{padding:14px 16px;border:2px solid #e8ecef;border-radius:12px;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:10px}
.option:hover{border-color:var(--accent);background:#f0fdfc}
.option-letter{font-weight:700;color:var(--primary);min-width:22px}
.option-text{flex:1}
.result-header{text-align:center;padding:24px 0}
.result-type{font-size:2rem;font-weight:700;color:var(--primary)}
.result-en{font-size:1.1rem;color:var(--muted);margin-top:4px;letter-spacing:1px}
.dimensions{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:20px}
.dim-row{display:flex;align-items:center;margin-bottom:16px}
.dim-row:last-child{margin-bottom:0}
.dim-label{width:80px;font-size:.8rem;color:var(--muted);text-align:right;padding-right:10px}
.dim-bar-wrap{flex:1;height:28px;background:#eef2f5;border-radius:14px;position:relative;overflow:hidden}
.dim-bar{height:100%;border-radius:14px;background:linear-gradient(90deg,var(--primary),var(--accent));width:0%;transition:width 1s ease}
.dim-center{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(0,0,0,.15)}
.dim-value{width:40px;text-align:left;padding-left:10px;font-weight:600;font-size:.9rem}
.dim-tags{display:flex;justify-content:space-between;padding:0 90px 0 100px;font-size:.75rem;color:var(--muted);margin-top:2px}
.portrait{background:var(--card);border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:20px}
.portrait h3{font-size:1.1rem;color:var(--primary);margin-bottom:12px}
.portrait p{font-size:1rem;line-height:1.8;color:var(--text)}
.code-tags{display:flex;justify-content:center;gap:12px;margin:16px 0;flex-wrap:wrap}
.code-tag{padding:6px 14px;border-radius:20px;background:#e8f4f8;color:var(--primary);font-size:.85rem;font-weight:600}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
#poster{width:750px;background:linear-gradient(160deg,#0f2c3e 0%,#1a5f7a 50%,#57c5b6 100%);color:#fff;padding:60px 50px;position:relative;overflow:hidden;margin:0 auto 20px}
#poster .poster-bg{position:absolute;top:-100px;right:-100px;width:400px;height:400px;background:rgba(255,255,255,.05);border-radius:50%}
#poster .poster-bg2{position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;background:rgba(255,255,255,.04);border-radius:50%}
#poster .poster-content{position:relative;z-index:2}
#poster .poster-title{font-size:1.2rem;opacity:.8;letter-spacing:4px;margin-bottom:8px}
#poster .poster-type{font-size:3rem;font-weight:700;margin-bottom:4px}
#poster .poster-en{font-size:1.1rem;opacity:.75;margin-bottom:30px;letter-spacing:2px}
#poster .poster-dims{margin-bottom:30px}
#poster .p-dim{display:flex;align-items:center;margin-bottom:14px}
#poster .p-dim-name{width:70px;font-size:.8rem;opacity:.8;text-align:right;padding-right:12px}
#poster .p-dim-bar{flex:1;height:10px;background:rgba(255,255,255,.15);border-radius:5px;position:relative}
#poster .p-dim-fill{height:100%;background:#fff;border-radius:5px;opacity:.9}
#poster .p-dim-tags{display:flex;justify-content:space-between;padding-left:82px;font-size:.7rem;opacity:.6;margin-top:2px}
#poster .p-dim-val{width:36px;padding-left:10px;font-size:.85rem;font-weight:600}
#poster .poster-portrait{background:rgba(255,255,255,.1);border-radius:16px;padding:24px;backdrop-filter:blur(4px)}
#poster .poster-portrait h4{font-size:1rem;margin-bottom:10px;opacity:.9}
#poster .poster-portrait p{font-size:.95rem;line-height:1.8;opacity:.92}
#poster .poster-footer{margin-top:30px;text-align:center;font-size:.8rem;opacity:.6;letter-spacing:1px}
@media (max-width:780px){#poster{width:100%!important;padding:40px 24px!important}#poster .poster-type{font-size:2.2rem}}
</style>
</head>
<body>
<div class="container">

<div id="page-home">
<div class="hero">
<h1>SciTI 人格测试</h1>
<div class="subtitle">发现你的科研人格类型</div>
<button class="btn btn-primary" onclick="startQuiz()">开始测试</button>
</div>
<div class="disclaimer">
<strong>免责声明</strong><br>
本测试仅供娱乐，切勿当真，请勿使用测试结果作为职业参考！<br>
由于测试开发者的科研经验匮乏，测试过程极易出现：刻板印象、轻率归纳、幻想场景、AI味文案。如出现焦虑等副作用请立刻停止使用。
</div>
</div>

<div id="page-quiz" class="hidden">
<div class="progress-wrap">
<div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
<div class="progress-text" id="progress-text">1 / 16</div>
</div>
<div id="quiz-container"></div>
</div>

<div id="page-result" class="hidden">
<div class="result-header">
<div class="result-type" id="res-type"></div>
<div class="result-en" id="res-en"></div>
<div id="res-svg" style="text-align:center;margin:16px 0;"></div>
<div class="code-tags" id="res-codes"></div>
</div>

<div class="dimensions">
<div class="dim-row"><div class="dim-label">实验耐受</div><div class="dim-bar-wrap"><div class="dim-bar" id="bar-0"></div><div class="dim-center"></div></div><div class="dim-value" id="val-0"></div></div>
<div class="dim-tags"><span>耗能</span><span>回血</span></div>
<div class="dim-row"><div class="dim-label">理论实操</div><div class="dim-bar-wrap"><div class="dim-bar" id="bar-1"></div><div class="dim-center"></div></div><div class="dim-value" id="val-1"></div></div>
<div class="dim-tags"><span>模型</span><span>湿实验</span></div>
<div class="dim-row"><div class="dim-label">能量流向</div><div class="dim-bar-wrap"><div class="dim-bar" id="bar-2"></div><div class="dim-center"></div></div><div class="dim-value" id="val-2"></div></div>
<div class="dim-tags"><span>独处</span><span>讨论</span></div>
<div class="dim-row"><div class="dim-label">认知闭合</div><div class="dim-bar-wrap"><div class="dim-bar" id="bar-3"></div><div class="dim-center"></div></div><div class="dim-value" id="val-3"></div></div>
<div class="dim-tags"><span>开放</span><span>自洽</span></div>
</div>

<div class="portrait">
<h3>人格画像</h3>
<p id="res-portrait"></p>
</div>

<div class="actions">
<button class="btn btn-primary" onclick="downloadPoster()">下载人格海报</button>
<button class="btn btn-secondary" onclick="location.reload()">再测一次</button>
</div>

<div style="height:0;overflow:hidden;">
<div id="poster">
<div class="poster-bg"></div>
<div class="poster-bg2"></div>
<div class="poster-content">
<div class="poster-title">SCI-TI 科研人格</div>
<div id="p-svg" style="text-align:center;margin:8px 0;"></div>
<div class="poster-type" id="p-type"></div>
<div class="poster-en" id="p-en"></div>
<div class="poster-dims" id="p-dims"></div>
<div class="poster-portrait">
<h4>人格画像</h4>
<p id="p-portrait"></p>
</div>
<div class="poster-footer">sciti personality test</div>
</div>
</div>
</div>
</div>

</div>

<script>
const dimensions=[
{name:"实验耐受",low:"耗能",high:"回血",questions:[
{text:"你第一次独立跑 Western blot，转膜完成后发现 marker 没转上。你的第一反应是？",options:["觉得有点烦，希望有人帮我重做一次","沮丧一会儿，然后老老实实从头排查问题，重来","叹口气，但立刻开始分析问题，再来一次","跃跃欲试，正好借这个机会把转膜条件优化一下"]},
{text:"实验室大扫除，师兄问谁愿意帮忙整理和校准一排移液枪，你的内心是？",options:["能躲就躲，这种事太机械了，我希望有专人负责","可以帮忙，但说实话不太享受这个过程","没问题，一边做一边觉得挺有秩序感","主动请缨，校准移液枪还挺解压的"]},
{text:"一个实验需要每2小时取样一次，持续12小时。你的感受更接近？",options:["心累，这么密集的操作会耗尽我一天的精气神","可以接受，但中间需要安排些休息和娱乐来缓冲","虽然累，但沉浸进去之后时间过得很快，还好","有种种田的踏实感，看着数据点一个个出来很满足"]},
{text:"你的实验记录本更接近以下哪种状态？",options:["经常事后补记，有时自己也看不懂当时写了什么","基本整洁，但偶尔会漏掉几个细节","按日期记录完整，实验条件和结果都有迹可循","工整到可以被当范本，旁边还会贴便利贴标注注意事项"]}
]},{name:"理论实操",low:"模型",high:"湿实验",questions:[
{text:"如果有一个课题是\"探究X基因在Y通路中的功能\"，你最想先做什么？",options:["搜文献画一张机制通路图，把可能的上下游都标注出来","先读已有论文，把逻辑链条理清楚，再想实验方案","设计和订制引物，先把这个基因的敲除/过表达构建起来","直接动手养细胞/提RNA，先看看它在自己体系里长什么样"]},
{text:"你在读一篇CNS论文，最让你感到兴奋的是哪个部分？",options:["摘要和模型图，我最喜欢漂亮的逻辑闭环","结果部分层层递进的实验设计，推理过程像侦探小说","Methods 里开发的新技术，想看看自己能不能复刻出来","补充数据里漂亮的原始图，每个条带都清晰利落，赏心悦目"]},
{text:"如果有一个暑假可以自由支配做科研（而且你也确实想做），你更倾向于？",options:["写一篇综述，梳理某个领域的思想脉络和未解决问题","分析公共数据库，做一些预测和建模","设计一套实验，完整地验证一个假说，从构建到功能","优化一个实验技术，把它做到可重复、可发表的标准"]},
{text:"对于\"眼见为实\"这句话，你在科研中的态度是？",options:["逻辑自洽也是一种\"实\"，完美的模型比单次数据更有说服力","数据重要，但如果和已有理论冲突，我会先怀疑数据","数据和模型要互相印证，两者缺一不可","没跑出来的数据我不信，一个干净的条带胜过千言万语"]}
]},{name:"能量流向",low:"独处",high:"讨论",questions:[
{text:"开完一次内容丰富的组会，你通常的感觉是？",options:["脑子快转不动了，需要一个人静一静","稍微有点累，但如果只和一个最熟的人再聊两句也可以","还挺兴奋，回去路上能和同门再讨论一路","电量满格，巴不得立刻拉着大家去咖啡馆继续头脑风暴"]},
{text:"你拿到一批新数据需要分析，你更喜欢哪种工作方式？",options:["一个人关在自习室或宿舍，把数据翻来覆去地看，做详细笔记","先自己分析一遍，然后找一个信任的人讨论一下关键点","叫上实验室一起做这个课题的伙伴，两个人边分析边讨论","直接在实验室公共区打开电脑，谁路过都可以聊两句看法"]},
{text:"周五晚上，你更期待哪种放松方式？",options:["一个人在宿舍看电影/看书/打游戏，不被打扰","和最好的朋友约个安静的小饭馆，两个人聊聊这一周","参加实验室的聚餐，一群人热闹热闹","组织一场桌游或活动，最好能认识些新朋友"]},
{text:"在实验室里，你的理想工作区是？",options:["角落里不太有人走动的那个实验台，自成一方小天地","靠窗的位置，光线好，偶尔有人路过但不会一直被打扰","和两三个熟悉的同门挨着，做实验时可以有一搭没一搭地聊","实验室正中间，随时能抓到人问问题或帮别人解决问题"]}
]},{name:"认知闭合",low:"开放",high:"自洽",questions:[
{text:"你做了一个实验，结果和预期完全相反，也没有明显操作失误。你的第一反应是？",options:["挺兴奋的，又发现了一个有趣的反常现象，先不急解释","好奇，想先看看有没有类似文献报道过，再判断","有点不舒服，脑子开始自动想几种可以解释的假说","很难受，今晚不找到一个合理说法恐怕睡不好觉"]},
{text:"组会上大家对一个新数据争论不休，导师说\"先保持开放\"，你觉得？",options:["完全没问题，不急着下结论反而能看到更多","可以理解，但我心里已经在默默排优先级了","稍微有点着急，希望能尽快确定一个最可能的解释","暗暗焦虑，这种悬着的感觉让我想赶紧拿新数据来拍板"]},
{text:"你在查文献了解一个新领域，你的阅读习惯更接近？",options:["先广泛浏览，让各种观点在脑中并存，慢慢形成框架","看几篇关键的，大致理清流派，但不急着站队","会较快形成一个初步判断，然后用后续阅读来验证","迅速找出一两篇最靠谱的综述，以此为基础搭建认知，先锁定再扩展"]},
{text:"以下哪种陈述最能描述你面对未知科学问题时的内心状态？",options:["不确定性让我感到自由，里面藏着最多可能性的宝藏","不确定性是可接受的，但需要有条理地慢慢梳理","我倾向于尽快把未知转化成可验证的假设，哪怕粗糙一点","悬而未决让我如坐针毡，我需要一个暂时的工作模型才能安心"]}
]}];const personalities={
"----":{cn:"沉思者",en:"DeepThinker",portrait:"你是实验室里最安静的深度思考者，用思维的光束扫过整片未知海域，容许矛盾和混沌的暗礁暂时存在。你尝试在内心迭代模型，但实验记录本还停在第一页。或许你会在组会沉默大半场，然后提出一个击中盲区的问题。"},
"---+":{cn:"游侠",en:"Ranger",portrait:"你不需要太多数据，也不想做太多重复性的实验，而是倾向在内心完成推演，并迅速站定一个解释。当新数据打脸时你会坦然接受，但在此之前，你相信自己的推理结果。"},
"--+-":{cn:"对撞机",en:"ILoveIdea",portrait:"你的聊天记录里充满了精妙的机制推演，而实验记录本空空如也，因为实验的速度根本无法追上你思维的疾驰！你在讨论中越聊越嗨，疯狂的联想让人分不清是天才还是走神。你不急着下结论，因为悬置与矛盾本身就很好玩。"},
"--++":{cn:"法官",en:"Judge",portrait:"你不必做实验，而是用你内心的法典评价每一个结果，并在听完报告五秒内抓住逻辑链的漏洞。你享受辩论，以及通过辩论快速结案，并且努力吸纳异常的结果，让你的理论体系重新自洽。"},
"-+--":{cn:"数据鉴赏家",en:"ILoveData",portrait:"你像品酒师一样对待数据。你不想每天都跑一大堆实验或者把一个实验跑很多遍（这实在太累了），但你做的每一个实验都经过深思熟虑。你觉得每一条异常条带都在讲故事，舍不得让任何一个细节被粗糙的结论埋没。"},
"-+-+":{cn:"棋手",en:"ChessPlayer",portrait:"你像棋手般规划实验，重复的动手操作或许对你是一种消耗，所以你在头脑中设计出一套一旦执行就直奔结论的实验方案。你能容忍实验失败，但不能容忍实验方向模糊，或者把结果留着不加解释。"},
"-++-":{cn:"演讲者",en:"Talker",portrait:"你亲自动手久了会疲劳，但你解读数据的口才和热情是无限的。你享受把复杂机制拆解成比喻，且能欣赏多种解释版本，能让每个人都觉得\"听你这么一讲，好像更清楚了\"。"},
"-+++":{cn:"黄金搭档",en:"INeedPartner",portrait:"你动手会累，但非常信任实验数据，并且最怕故事只讲一半。因此你不避讳自己动手会累这件事，反而积极地寻找动手达人。拿到数据后你会尝试迅速下定结论，让项目进入下一阶段。你寻找搭档的眼光精准，因为你知道互补是最高效的科研加速器。"},"+---":{cn:"雕刻家",en:"Sculptor",portrait:"你或许能从重复性操作中获得平静，但同时你的大脑从未停止构建模型。做实验对你来说像是一场通过双手的冥想。你反复打磨想法，搁置一些尚不知如何处理的矛盾并不会使你焦虑。你相信当你雕得足够深，真理会自己浮现。"},
"+--+":{cn:"流水线",en:"OnePersonCompany",portrait:"你一个人就是一个科研企业！从理论生产到实验拍板，全部可以内循环。脑中生出假说后，自己走进实验室，干脆利落地拿到结果（失败了也没关系我喜欢做实验），然后得到一个确切的\"是\"或\"否\"。你的实验记录本是一系列高频的判决：已验证，已推翻，下一个。"},
"+-+-":{cn:"主持人",en:"Host",portrait:"你的实验台是圆的，邀请所有路过的智人一起动手、一起讨论。你享受一边操作一边和周围人交换想法，把实验变成一种社交和创造的混合。你不急着得出结论，因为你享受的是大家一起头脑风暴、共同发现的过程。"},

"++-+":{cn:"炼金士",en:"Alchemist",portrait:"你在独自操作中找到一种类似\"炼金\"的专注感和幸福感。你享受实验操作本身，做实验让你觉得平静，而实验数据是真理的唯一通行证。但是你的数据必须得到解释——否则下一步要怎么设计呢？得到结论后，你会收拾干净台面，记录在案，然后 move on。"},

};const allQuestions=[];
dimensions.forEach((dim,dimIdx)=>{
  dim.questions.forEach(q=>{
    allQuestions.push({dim:dimIdx,text:q.text,options:q.options});
  });
});
let answers=[],currentQ=0,shuffled=[];
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function startQuiz(){
  document.getElementById('page-home').classList.add('hidden');
  document.getElementById('page-quiz').classList.remove('hidden');
  shuffled=shuffle(allQuestions);
  answers=new Array(shuffled.length).fill(null);
  currentQ=0;
  renderQuestion();
}
function renderQuestion(){
  const q=shuffled[currentQ];
  const prog=((currentQ)/shuffled.length*100).toFixed(0);
  document.getElementById('progress-fill').style.width=prog+'%';
  document.getElementById('progress-text').textContent=(currentQ+1)+' / '+shuffled.length;
  let html='<div class="question-card">';
  html+='<div class="question-number">问题 '+(currentQ+1)+'</div>';
  html+='<div class="question-text">'+escapeHtml(q.text)+'</div>';
  html+='<div class="options">';
  const letters=['A','B','C','D'];
  q.options.forEach((opt,idx)=>{
    html+='<div class="option" onclick="selectOption('+idx+')">';
    html+='<div class="option-letter">'+letters[idx]+'</div>';
    html+='<div class="option-text">'+escapeHtml(opt)+'</div>';
    html+='</div>';
  });
  html+='</div></div>';
  document.getElementById('quiz-container').innerHTML=html;
}
function escapeHtml(text){
  const div=document.createElement('div');
  div.textContent=text;
  return div.innerHTML;
}
function selectOption(idx){
  answers[currentQ]=idx+1;
  currentQ++;
  if(currentQ<shuffled.length){
    renderQuestion();
  }else{
    showResult();
  }
}function showResult(){
  document.getElementById('page-quiz').classList.add('hidden');
  document.getElementById('page-result').classList.remove('hidden');
  const scores=[0,0,0,0];
  const counts=[0,0,0,0];
  for(let i=0;i<shuffled.length;i++){
    const dim=shuffled[i].dim;
    scores[dim]+=answers[i];
    counts[dim]++;
  }
  let code='';
  const codeTags=[];
  for(let d=0;d<4;d++){
    const high=scores[d]>=10;
    code+=high?'+':'-';
    const tag=high?dimensions[d].high:dimensions[d].low;
    codeTags.push(tag);
  }
  const p=personalities[code];
  const svgTemplate=document.querySelector('#svg-templates [data-code="'+code+'"] svg');
  if(svgTemplate){
    const svgClone=svgTemplate.cloneNode(true);
    svgClone.setAttribute('width','140');
    svgClone.setAttribute('height','180');
    const resSvg=document.getElementById('res-svg');
    if(resSvg){resSvg.innerHTML='';resSvg.appendChild(svgClone);}
    const pSvg=document.getElementById('p-svg');
    if(pSvg){const pClone=svgTemplate.cloneNode(true);pClone.setAttribute('width','90');pClone.setAttribute('height','115');pSvg.innerHTML='';pSvg.appendChild(pClone);}
  }
  document.getElementById('res-type').textContent=p.cn;
  document.getElementById('res-en').textContent=p.en;
  document.getElementById('res-portrait').textContent=p.portrait;
  const tagsHtml=codeTags.map(t=>'<div class="code-tag">'+t+'</div>').join('');
  document.getElementById('res-codes').innerHTML=tagsHtml;
  for(let d=0;d<4;d++){
    const pct=((scores[d]-4)/12*100).toFixed(1);
    document.getElementById('bar-'+d).style.width=pct+'%';
    document.getElementById('val-'+d).textContent=scores[d];
  }
  document.getElementById('p-type').textContent=p.cn;
  document.getElementById('p-en').textContent=p.en;
  document.getElementById('p-portrait').textContent=p.portrait;
  let pdimHtml='';
  for(let d=0;d<4;d++){
    const pct=((scores[d]-4)/12*100).toFixed(1);
    pdimHtml+='<div class="p-dim">';
    pdimHtml+='<div class="p-dim-name">'+dimensions[d].name+'</div>';
    pdimHtml+='<div class="p-dim-bar"><div class="p-dim-fill" style="width:'+pct+'%"></div></div>';
    pdimHtml+='<div class="p-dim-val">'+scores[d]+'</div>';
    pdimHtml+='</div>';
    pdimHtml+='<div class="p-dim-tags"><span>'+dimensions[d].low+'</span><span>'+dimensions[d].high+'</span></div>';
  }
  document.getElementById('p-dims').innerHTML=pdimHtml;
}
function downloadPoster(){
  const poster=document.getElementById('poster');
  poster.style.display='block';
  html2canvas(poster,{scale:2,backgroundColor:null}).then(canvas=>{
    poster.style.display='';
    const link=document.createElement('a');
    link.download='SciTI_'+document.getElementById('res-type').textContent+'_poster.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
  });
}
